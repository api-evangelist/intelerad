meters:
- name: image_storage
  description: Volume of DICOM images / studies stored and retained in the cloud platform.
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - namespace
- name: study_volume
  description: Number of studies ingested / exchanged across the network.
  unit: studies
  aggregation: sum
  dimensions:
  - account
  - namespace
- name: connected_sites
  description: Number of connected sites / namespaces / integrations under the agreement.
  unit: sites
  aggregation: max
  dimensions:
  - account
- name: platform_contract
  description: The enterprise license / subscription fee for the contracted products.
  unit: contract
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track study and image storage volume per namespace / site so imaging spend maps to facilities and service lines.
- name: Allocation
  description: Use namespaces to attribute image-exchange and storage usage to internal cost centers.
- name: Optimization
  description: Manage retention and archival tiers (VNA) to control long-term storage cost; consolidate integrations to reduce interface overhead.
- name: Accountability
  description: Assign owners per site / namespace and review study volume and storage against the contracted agreement.
