description: >-
  FinOps view of Intelerad platform spend. Intelerad is sold as contracted
  enterprise imaging software (PACS, viewer, VNA, InteleShare / Ambra image
  exchange) rather than as a metered public API product, so there is no
  self-service usage-based API invoice. Cost drivers are the enterprise
  agreement itself plus the underlying scale of the deployment - study and image
  volume, cloud storage retained (the platform manages tens of billions of
  images), number of connected sites / namespaces, modules, and integration
  breadth (DICOM / HL7 / FHIR, EHR / RIS). API and Storage API access is included
  in the platform contract.
notes: >-
  No public per-unit rates are available; all figures are contract-specific.
  This artifact frames where cost accrues for planning, not actual prices.
  Confirm commercial terms with Intelerad.
