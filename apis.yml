  - Webhooks
  - Routing
  - Events
  - Destinations
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://access.dicomgrid.com/api/v3/api.html
  baseURL: https://access.dicomgrid.com/api/v3
  properties:
  - url: https://access.dicomgrid.com/api/v3/api.html
    type: APIReference
  - url: openapi/intelerad-openapi.yml
    type: OpenAPI
  description: Register webhooks for platform events and manage study distribution -
    routes, destinations (query/retrieve targets), and storage nodes that move studies
    between the cloud and connected DICOM systems. Endpoints are modeled from the
    public v3 Services API reference.
- aid: intelerad:intelerad-namespaces-accounts-api
  name: InteleShare Namespaces and Accounts API
  tags:
  - Namespaces
  - Accounts
  - Users
  - Multi-Tenancy
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://access.dicomgrid.com/api/v3/api.html
  baseURL: https://access.dicomgrid.com/api/v3
  properties:
  - url: https://access.dicomgrid.com/api/v3/api.html
    type: APIReference
  - url: openapi/intelerad-openapi.yml
    type: OpenAPI
  description: Administer the multi-tenant structure of the platform - accounts,
    namespaces (tenant scoping and access control), users, invitations, roles, and
    API tokens. Includes session management (login/logout, OAuth, CSRF). Endpoints are
    modeled from the public v3 Services API reference.
