  name: InteleShare Patients API
  tags:
  - Patients
  - Demographics
  - PHI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://access.dicomgrid.com/api/v3/api.html
  baseURL: https://access.dicomgrid.com/api/v3
  properties:
  - url: https://access.dicomgrid.com/api/v3/api.html
    type: APIReference
  - url: openapi/intelerad-openapi.yml
    type: OpenAPI
  description: Create, list, get, and update patient records and demographics, manage
    PHI and patient-portal (PHR) access, and reconcile / normalize patient identity
    across sources. Endpoints are modeled from the public v3 Services API reference.
- aid: intelerad:intelerad-worklist-orders-api
