apis:
- aid: intelerad:intelerad-studies-api
  name: InteleShare Studies API
  tags:
  - Studies
  - DICOM
  - DICOMweb
  - Imaging
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://access.dicomgrid.com/api/v3/api.html
  baseURL: https://access.dicomgrid.com/api/v3
  properties:
  - url: https://access.dicomgrid.com/api/v3/api.html
    type: APIReference
  - url: https://www.intelerad.com/en/interoperability/
    type: Documentation
  - url: openapi/intelerad-openapi.yml
    type: OpenAPI
  description: Manage DICOM studies in the InteleShare / Ambra cloud - list, get,
    share, route, tag, and delete studies, retrieve study metadata and images, and
    push or pull pixel data. DICOM instance access is also available over the DICOMweb
    standard (WADO-RS retrieve, QIDO-RS query, STOW-RS store). Endpoints are modeled
    from the public v3 Services API reference (RPC-style POST actions under a
    namespace).
- aid: intelerad:intelerad-storage-api
  name: InteleShare Storage API
  tags:
  - Storage
  - DICOMweb
  - Images
  - Pixel Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://access.dicomgrid.com/api/v3/storage/storage_api.html
  baseURL: https://access.dicomgrid.com/api/v3/storage
  properties:
  - url: https://access.dicomgrid.com/api/v3/storage/storage_api.html
    type: APIReference
  - url: openapi/intelerad-openapi.yml
    type: OpenAPI
  description: The Storage API handles the raw DICOM image and study binary layer -
    upload (STOW-style ingest), retrieve rendered or original images and frames, wrap
    and unwrap DICOM, and manage thumbnails. Complements the Services API, which
    handles metadata and workflow. Endpoints are modeled from the public Storage API
    reference.
