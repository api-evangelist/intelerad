name: Intelerad
kind: company
description: Intelerad Medical Systems is an enterprise medical imaging company whose
  platform spans diagnostic PACS (IntelePACS), the InteleViewer / zero-footprint web
  viewer, a vendor-neutral archive (VNA), and the cloud image-exchange platform
  InteleShare - the product formed after Intelerad acquired Ambra Health (Ambra Image
  Exchange) in 2021. The InteleShare / Ambra platform exposes a documented public
  "v3 Services" REST-like API plus a Storage API for programmatically managing DICOM
  studies, patients, orders, reports, HL7 message flows, routing, and multi-tenant
  namespaces. Integration is built on medical-imaging interoperability standards -
  DICOM and DICOMweb (WADO / QIDO / STOW), HL7 v2 (ORM, ORU, ADT), and FHIR - with a
  Gateway that routes DICOM and HL7 between on-premise systems and the cloud, plus
  EHR/RIS integrations (Epic, Cerner, Athena). Core PACS/RIS APIs are partner- and
  contract-gated; the InteleShare / Ambra v3 API is the publicly documented developer
  surface.
