- aid: intelerad:intelerad-hl7-api
  name: InteleShare HL7 Integration API
  tags:
  - HL7
  - Interoperability
  - Messaging
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.intelerad.com/en/wp-content/uploads/sites/2/2024/05/InteleShare-3.24.2.0-HL7-Guide.pdf
  baseURL: https://access.dicomgrid.com/api/v3
  properties:
  - url: https://access.dicomgrid.com/api/v3/api.html
    type: APIReference
  - url: https://www.intelerad.com/en/wp-content/uploads/sites/2/2024/05/InteleShare-3.24.2.0-HL7-Guide.pdf
