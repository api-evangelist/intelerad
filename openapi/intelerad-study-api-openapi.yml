openapi: 3.2.0
info:
  title: InteleShare / Ambra v3 Services API (Modeled) Study API
  version: v3
  x-endpoints-modeled: true
  description: MODELED OpenAPI for the Intelerad InteleShare / Ambra "v3 Services" public API (formerly Ambra Health / DICOM Grid).
  contact:
    name: Intelerad Medical Systems
    url: https://www.intelerad.com/en/contact-us/
servers:
- url: https://access.dicomgrid.com/api/v3
  description: InteleShare / Ambra v3 Services API (public cloud; account-specific hosts also exist, e.g. https://access.ambrahealth.com/api/v3)
security:
- sid: []
- basicAuth: []
- oauth: []
tags:
- name: Study
paths:
  /study/list:
    post:
      tags:
      - Study
      summary: List studies visible to the session, with filtering and pagination
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
      operationId: postStudyList
      x-operation-id-source: derived
  /study/get:
    post:
      tags:
      - Study
      summary: Retrieve a single study's metadata by uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
      operationId: postStudyGet
      x-operation-id-source: derived
  /study/share:
    post:
      tags:
      - Study
      summary: Share a study to another namespace, user, or patient
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
      operationId: postStudyShare
      x-operation-id-source: derived
  /study/delete:
    post:
      tags:
      - Study
      summary: Delete a study
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
      operationId: postStudyDelete
      x-operation-id-source: derived
components:
  schemas:
    StatusResponse:
      type: object
      description: Every v3 Services response includes a status field of OK or ERROR.
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - OK
          - ERROR
        error_type:
          type: string
          description: Present when status is ERROR.
        error_subtype:
          type: string
  securitySchemes:
    sid:
      type: apiKey
      in: query
      name: sid
      description: Session id obtained from /session/login. May also be supplied as a request field depending on the endpoint.
    basicAuth:
      type: http
      scheme: basic
    oauth:
      type: http
      scheme: bearer
      description: OAuth bearer token for third-party integrations.
